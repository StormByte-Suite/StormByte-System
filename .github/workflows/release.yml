name: Release

# Run manually on an existing tag and GitHub release. The action replaces
# that release's matching assets; it does not create tags or releases.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-26.04
    steps:
      - name: Require a tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != tag ]]; then
            echo "::error::Selected ref is '$REF_NAME'. Run this workflow on a tag, not on master."
            exit 1
          fi
          echo "Release tag: $REF_NAME"

  checkout-bootstrap:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm submodule / checkout cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

  apt-bootstrap:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    name: apt-bootstrap (${{ matrix.runner }})
    steps:
      - name: Warm APT lists cache
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists

  build-linux:
    needs: [checkout-bootstrap, apt-bootstrap]
    permissions:
      actions: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
        libc: [glibc, musl]
        toolchain:
          - compiler: gcc
            stdlib: libstdc++
          - compiler: clang
            stdlib: libc++
    runs-on: ${{ matrix.platform.runner }}
    name: linux-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.stdlib }}
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          extra="${{ github.workspace }}/build/lib:${{ github.workspace }}/build/buildmaster/install/lib:${{ github.workspace }}/build/buildmaster/install/lib64"
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            current="$(printenv "$name" || :)"
            if [[ -n "$current" ]]; then
              printf '%s=%s:%s\n' "$name" "$current" "$extra" >> "$GITHUB_ENV"
            else
              printf '%s=%s\n' "$name" "$extra" >> "$GITHUB_ENV"
            fi
          done

      - name: Build and deploy with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          cxx-stdlib: ${{ matrix.toolchain.stdlib }}
          libc: ${{ matrix.libc }}
          compiler-cache-key: system-v1
          compiler-cache-scope: ${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}
          buildmaster-cache-key: bm-system-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}
          build-type: ${{ env.BUILD_TYPE }}
          pgo: true
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DWITH_STORMBYTE=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          install-prefix: package
          deploy: true

  build-macos:
    needs: [checkout-bootstrap]
    runs-on: macos-latest
    name: macos-arm64
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          extra="${{ github.workspace }}/build/lib:${{ github.workspace }}/build/buildmaster/install/lib:${{ github.workspace }}/build/buildmaster/install/lib64"
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            current="$(printenv "$name" || :)"
            if [[ -n "$current" ]]; then
              printf '%s=%s:%s\n' "$name" "$current" "$extra" >> "$GITHUB_ENV"
            else
              printf '%s=%s\n' "$name" "$extra" >> "$GITHUB_ENV"
            fi
          done

      - name: Build and deploy with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: clang
          compiler-cache-key: system-v1
          buildmaster-cache-key: bm-system-macos-clang
          build-type: ${{ env.BUILD_TYPE }}
          pgo: true
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DWITH_STORMBYTE=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          install-prefix: package
          deploy: true

  build-windows:
    needs: [checkout-bootstrap]
    runs-on: windows-latest
    name: windows-x64
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and deploy with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: clang-cl
          compiler-cache-key: system-v1
          buildmaster-cache-key: bm-system-windows-clang-cl
          build-type: ${{ env.BUILD_TYPE }}
          pgo: true
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DWITH_STORMBYTE=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          install-prefix: package
          deploy: true

  docs:
    needs: [guard, checkout-bootstrap, apt-bootstrap]
    uses: stormbytepp/githubactions/.github/workflows/generate-and-deploy-docs.yml@master
    with:
      doc_target: StormByteSystemDoc
      extra-cmake-options: >-
        -DENABLE_DOC=ON
        -DWITH_STORMBYTE=BUNDLED
        -DBUILD_SHARED_LIBS=ON
      docs_output_dir: ./_site
